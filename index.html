<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch sử Triều đại Việt Nam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FIX: Sử dụng Noto Serif và Roboto với subset=vietnamese để đảm bảo hiển thị đúng dấu tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:wght@300;400;500;700&display=swap&subset=vietnamese" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto', 'sans-serif'],
              serif: ['"Noto Serif"', 'serif'],
            }
          }
        }
      }
    </script>

    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background-color: #fdfbf7; /* Parchment-like off-white */
      }
      /* Đảm bảo tất cả các thẻ tiêu đề đều dùng font Serif hỗ trợ tốt tiếng Việt */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Noto Serif', serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <!-- Quan trọng: Load file index.tsx từ thư mục gốc -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
